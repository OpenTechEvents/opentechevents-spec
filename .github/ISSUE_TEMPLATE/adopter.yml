name: Register as an adopter
description: My community publishes an OTE feed — validate it and list it on opentechevents.org.
title: "[Adopter] "
labels: ["adopter"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for adopting OTE! We'll validate your feed, list your community on
        [opentechevents.org](https://opentechevents.org) and aggregators will start
        picking up your events.

        Tip: the [registration form](https://opentechevents.org/register/) prefills
        this issue for you — including the directory link, if your community is
        listed in one.

        Want to check the feed first? Paste its URL into the
        [online validator](https://validator.opentechevents.org/). If the check here
        fails, the comment links your feed there; fix it on your server and comment
        `/revalidate` on this issue to run the check again.
  - type: input
    id: community
    attributes:
      label: Community name
      placeholder: PyAlmería
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Website
      placeholder: https://pyalmeria.example
    validations:
      required: false
  - type: input
    id: feed
    attributes:
      label: OTE feed URL
      description: >-
        Public URL of your `events.json` feed. Serve it with
        `Access-Control-Allow-Origin: *` so readers running in a browser can fetch it
        too — [how and why](https://opentechevents.org/#serving). Not required: a feed
        without it is valid and gets listed all the same.
      placeholder: https://pyalmeria.example/events.json
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What it is
      description: >-
        What the entity is, which is separate from what it does with feeds. A community
        organises its own events; a directory lists events from several organisers.
      options:
        - Community
        - Directory
    validations:
      required: true
  - type: dropdown
    id: consumes
    attributes:
      label: Also a consumer
      description: >-
        Whether you also READ OTE feeds published by others. It lists you under "Who consumes
        OTE data" too — same entry, no second registration. Intent is listed as intent: tell
        us you plan to and the entry says "coming soon" until it is live.
      options:
        - "No"
        - "Yes, already consuming OTE feeds"
        - "Planned, not yet live"
    validations:
      required: false
  - type: input
    id: logo
    attributes:
      label: Logo URL
      description: >-
        Square-ish image shown next to your community on opentechevents.org. Leave empty
        to show your initials instead. Best is a permanent URL on your own site. A link to
        an image you uploaded to GitHub works too — those expire after a few minutes, so
        the check copies the image into the repository instead of linking it.
      placeholder: https://pyalmeria.example/logo.png
    validations:
      required: false
  - type: input
    id: directory
    attributes:
      label: Community directory ID
      description: >-
        Filled automatically by the registration form when your community is matched
        in a linked directory (e.g. `combuilders:42`). Leave empty if you don't know it.
      placeholder: "combuilders:42"
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I am an organiser of this community and I want its feed listed as an OTE adopter.
          required: true
